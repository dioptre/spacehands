<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacehands Projector / Walkie</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; background:#000; color:#fff; overflow:hidden; font-family:monospace; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; }
  #cam { width:100vw; height:100vh; object-fit:cover; image-rendering:auto; clip-path:inset(0 var(--crop-right, 0px) 0 var(--crop-left, 0px)); transform:scaleX(var(--flip-x, 1)); }
  #ui {
    position:fixed; left:12px; bottom:12px; right:12px;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:10px; background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.2);
    opacity:1; transform:translateY(0); transition:opacity .35s ease, transform .35s ease;
  }
  body.ui-hidden #ui { opacity:0; transform:translateY(18px); pointer-events:none; }
  input, select { background:#111; color:#fff; border:1px solid #555; padding:6px; font:12px monospace; }
  input.crop { width:62px; }
  button { background:#1a1a1a; color:#fff; border:1px solid #666; padding:7px 10px; font:12px monospace; cursor:pointer; }
  button.active { background:#420; border-color:#fa6; }
  #status { opacity:0.75; margin-left:auto; }
  .hint { opacity:0.6; }
</style>
</head>
<body>
<div id="stage"><img id="cam" alt="raw camera stream"></div>
<div id="ui">
  <span>Pi host</span>
  <input id="host" placeholder="raspberrypi.local or 192.168.x.x" size="32">
  <button id="connect">connect camera</button>
  <label>mic <select id="mic-select"><option value="">default</option></select></label>
  <label>speaker <select id="speaker-select"><option value="">default</option></select></label>
  <button id="test-speaker">test speaker</button>
  <label>L crop <input class="crop" id="crop-left" type="number" min="0" max="800" value="0"></label>
  <label>R crop <input class="crop" id="crop-right" type="number" min="0" max="800" value="0"></label>
  <button id="flip-image">flip: off</button>
  <button id="talk">start 2-way audio</button>
  <button id="listen">audio stopped</button>
  <audio id="pi-audio" autoplay playsinline></audio>
  <span class="hint">Camera: Pi → projector. Audio runs constantly both ways after one click.</span>
  <span id="status">idle</span>
</div>
<script src="projector.js"></script>
</body>
</html>
